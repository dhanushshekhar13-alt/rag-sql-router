[project]
name = "rag-sql-router"
version = "0.1.0"
description = "An agent that routes each question to document RAG, a SQL database, or both."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qdrant-client>=1.9",
    "fastembed>=0.3",
    "pypdf>=4.0",
    "ollama>=0.3",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
